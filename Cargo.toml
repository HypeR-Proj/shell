[package]
name = "hyper-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Unit-test modules live in tests/ and are included by their owning library.
autotests = false

[[bin]]
name = "hyper-shell"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hyper-terminal = { path = "../../lib/terminal" }
clap.workspace = true
hyper-os.workspace = true
hyper-rt.workspace = true
hyper-service.workspace = true
hyper-component.workspace = true
hyper-service-ipc.workspace = true
hyper-journal.workspace = true
shlex = "=1.3.0"
serde.workspace = true
serde_json.workspace = true
unicode-width = "=0.2.2"

[lints]
workspace = true


[target.'cfg(target_os = "hyper")'.dependencies]
hyper-clap-shared.workspace = true
