bin = [{name = "hyper-shell", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-shell"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/shell"
publish = false
autotests = false
workspace = ".."

[dependencies]
shlex = "=1.3.0"
unicode-width = "=0.2.2"

[dependencies.hyper-terminal]
version = "=0.0.0"
path = "../../lib/terminal"

[dependencies.clap]
workspace = true
features = ["derive"]

[dependencies.hyper-os]
workspace = true

[dependencies.hyper-rt]
workspace = true
features = ["std"]

[dependencies.hyper-service]
workspace = true

[dependencies.hyper-component]
workspace = true

[dependencies.hyper-service-ipc]
workspace = true

[dependencies.hyper-journal]
workspace = true

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
workspace = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]

[target]

[target."cfg(target_os = \"hyper\")"]

[target."cfg(target_os = \"hyper\")".dependencies]

[target."cfg(target_os = \"hyper\")".dependencies.hyper-clap-shared]
workspace = true
